name: Windows preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      GLITCHTRACE_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
      - name: Check request-only archive roundtrip
        run: python tests/test_handoff_pack.py
      - name: Prepare vendored dependency check
        shell: pwsh
        run: |
          cargo vendor --locked --versioned-dirs vendor | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content .cargo/config.toml "`n[source.crates-io]`nreplace-with = 'vendored-sources'`n[source.vendored-sources]`ndirectory = 'vendor'"
      - name: Build and test without GitHub or dependency downloads
        shell: pwsh
        run: ./tools/Build-Windows.ps1 -Offline -RunInstallerChecks
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: GlitchTrace_v1.0-preview.1_windows-x64
          path: |
            dist/*_setup.exe
            dist/*_portable.zip
            dist/SHA256SUMS.txt
            dist/BUILD_REPORT.json
          if-no-files-found: error
      - name: Publish first preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0-preview.1 --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'This release already exists; artifacts are retained on this run. Existing release assets are never overwritten.'
            exit 0
          }
          gh release create v1.0-preview.1 dist/*_setup.exe dist/*_portable.zip dist/SHA256SUMS.txt --target '${{ github.sha }}' --title 'GlitchTrace 1.0 Preview 1' --notes-file docs/RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
